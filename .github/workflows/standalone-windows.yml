name: standalone-windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build crapper.exe
        shell: pwsh
        run: ./scripts/build-standalone.ps1
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: crapper-windows-x64
          path: dist/crapper.exe
      - name: Release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/crapper.exe
